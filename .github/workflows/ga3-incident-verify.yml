name: Validate Q4 incident protocol
on:
  push:
    branches: [codex/ga3-solutions]
    paths: [.github/scripts/verify_incident.py, .github/workflows/ga3-incident-verify.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ga3-incident-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate active temporary service
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 24); do
            run_id=$(gh api 'repos/${{ github.repository }}/actions/workflows/ga3-incident-service.yml/runs?branch=codex%2Fga3-solutions' --jq '.workflow_runs[] | select(.status == "in_progress") | .id' | head -n 1)
            if [ -n "$run_id" ]; then
              artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name == "incident-submission-url") | .id')
              if [ -n "$artifact_id" ]; then
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'No validated temporary service was published'
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: incident-submission-url
          path: /tmp/ga3-deployment
          run-id: ${{ steps.active.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Validate deployed endpoints with synthetic samples
        working-directory: assignment
        run: |
          python -m pip install -r requirements.txt 'pytest>=8,<9'
          python ../.github/scripts/verify_incident.py
      - name: Collect encrypted support packets
        if: always()
        working-directory: assignment
        run: python ../.github/scripts/collect_ga3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-support-packets
          path: /tmp/ga3-encrypted-support/*.json
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: incident-validation-results
          path: /tmp/ga3-incident-validation.json
          retention-days: 1
