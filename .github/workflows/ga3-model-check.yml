name: Check authenticated model capacity
on:
  push:
    branches: [codex/ga3-solutions]
    paths: [.github/workflows/ga3-model-check.yml]
permissions:
  contents: read
  models: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test GitHub Models with workflow authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u - <<'PY'
          import json,os,time,urllib.request,urllib.error
          body={'model':'openai/gpt-4.1-mini','messages':[{'role':'user','content':'Return only a JSON object with ok:true.'}],'response_format':{'type':'json_object'},'max_tokens':32}
          start=time.monotonic()
          request=urllib.request.Request('https://models.github.ai/inference/chat/completions',data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(request,timeout=30) as response:
                  data=response.read().decode();ctype=response.headers.get('content-type')
                  print('HTTP',response.status,'content-type',ctype,'seconds',round(time.monotonic()-start,2))
                  result=json.loads(data)
                  assert json.loads(result['choices'][0]['message']['content'])['ok'] is True
                  print('Authenticated inference verified')
          except urllib.error.HTTPError as error:
              print('HTTP',error.code,error.read().decode()[:1000])
              raise
          PY
