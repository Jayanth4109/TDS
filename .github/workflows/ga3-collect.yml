name: Collect encrypted runtime diagnostics
on:
  push:
    branches: [codex/ga3-solutions]
    paths: [.github/workflows/ga3-collect.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: temporary-submission-url
          path: /tmp/ga3-deployment
          run-id: 40214150881
          github-token: ${{ github.token }}
      - run: |
          python -m pip install httpx==0.28.1
          python .github/scripts/collect_ga3.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-support-packets
          path: /tmp/ga3-encrypted-support/*.json
          retention-days: 1
